My navbar will be here

<header>

    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container">
            <a href="/" class="logo"><img src="/static/favicon/logo.png" alt="Ai Song Download logo" width="32"
                    height="32" decoding="async" />
                <span>Download Ai Songs</span>
            </a>


            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link btn btn-primary my-2 my-lg-0 ms-lg-2 active" href="/">🏠 Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link btn btn-primary my-2 my-lg-0 ms-lg-2" href="/dashboard">
                            ⚡ Dashboard
                        </a>
                    </li>

                    {% if current_user.is_authenticated %}


                    <li class="nav-item">
                        <a class="btn btn-danger my-2 my-lg-0 ms-lg-2" href="/logout">
                            <a class="nav-link" href="/logout">
                                🏃‍♂️ Logout
                            </a>
                    </li>

                    {% else %}

                    <li class="nav-item">
                        <a class="btn btn-primary my-2 my-lg-0 ms-lg-2" href="/login">
                            🔑 Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-primary my-2 my-lg-0 ms-lg-2" href="/register">
                            🚀 Register
                        </a>
                    </li>

                    {% endif %}

                </ul>
            </div>
        </div>
    </nav>
</header>
